<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Prefer the Miku Emoji font for every lookup. The font only contains the
  emoji codepoints listed in /usr/share/doc/ttf-miku-emoji/README.md, so all
  other characters and emoji fall through to the normal stack (Noto Color
  Emoji etc.).

  Chromium/Skia builds its emoji fallback from the generic fontconfig sort,
  which is why the family is prepended on every pattern instead of being
  appended to a specific family.
-->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong">
      <string>Miku Emoji</string>
    </edit>
  </match>

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Miku Emoji</family>
    </prefer>
  </alias>
</fontconfig>
