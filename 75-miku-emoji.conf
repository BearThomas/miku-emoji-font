<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Prefer Miku Emoji ONLY on the generic sans-serif lookups that Chromium uses
  for emoji fallback (family resolves to "Arial" or "Liberation Sans").

  An unconditional prepend breaks website font pickers and code fonts, because
  every family request gets hijacked. Charset-based tests do not work here:
  Chromium's emoji fallback query does not carry FC_CHARSET.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Miku Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Miku Emoji</string>
    </edit>
  </match>
</fontconfig>
